name: Release

# Publica os binários prontos. O egg do Pterodactyl baixa direto daqui, então
# uma release desatualizada é o que faz o egg cair no caminho lento de compilar.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar (ex: v0.2.0)'
        required: true

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Testes
        run: go test ./...

      - name: Compilar
        run: |
          mkdir -p dist
          # CGO desligado: binário estático, roda em qualquer imagem de
          # container sem depender das bibliotecas de onde foi compilado.
          for alvo in "linux amd64" "linux arm64" "windows amd64"; do
            set -- $alvo
            nome="greenlabs-server-$1-$2"
            [ "$1" = "windows" ] && nome="$nome.exe"
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags "-s -w -X main.versao=${{ github.event.inputs.tag || github.ref_name }}" \
                -o "dist/$nome" ./src
            echo "$nome: $(stat -c%s "dist/$nome") bytes"
          done

      - name: Conferir que as flags estão lá
        run: |
          # O servidor ignora flag que não conhece, em silêncio. Se um binário
          # sair sem --sfu, o egg instala, o painel manda a flag, nada acontece
          # e ninguém recebe erro. Melhor a release nem existir.
          ajuda=$(./dist/greenlabs-server-linux-amd64 --help)
          for flag in --port --sfu --tunnel; do
            echo "$ajuda" | grep -q -- "$flag" || { echo "faltou $flag"; exit 1; }
          done
          echo "ok: --port, --sfu e --tunnel presentes"

          # A versao precisa bater com a tag. Ela ja ficou fixa no codigo, e o
          # binario da v0.2.2 se anunciava como v0.2.0 - com isso nao havia
          # como saber o que estava rodando num servidor.
          esperada="${{ github.event.inputs.tag || github.ref_name }}"
          if ! ./dist/greenlabs-server-linux-amd64 --help | head -1 >/dev/null; then exit 1; fi
          if ! timeout 3 ./dist/greenlabs-server-linux-amd64 --port 25999 2>&1 | grep -q "$esperada"; then
            echo "::error::o binario nao se anuncia como $esperada"
            exit 1
          fi
          echo "ok: o binario se anuncia como $esperada"

      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
